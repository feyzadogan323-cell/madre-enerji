<script>
(function(){
function cp(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
/* belge → düz yol listesi: c␁id (varlık), c␁id␁alan, nesne alanlarında c␁id␁alan␁anahtar */
function flatDoc(c,id,doc,out){out[c+SEP+id]=1;Object.keys(doc).forEach(function(f){var v=doc[f],p=c+SEP+id+SEP+f;
  if(isObj(v)){out[p]={__o:1};Object.keys(v).forEach(function(s){out[p+SEP+s]=v[s]})}else out[p]=v});return out}
function flatAll(st){var o={};Object.keys(st).forEach(function(c){Object.keys(st[c]||{}).forEach(function(id){flatDoc(c,id,st[c][id],o)})});return o}
/* düz kayıtlar {yol:{v,t,d?}} → koleksiyonlar */
function build(E){var st={},docs={};Object.keys(E).forEach(function(p){var e=E[p];if(e.d)return;var a=p.split(SEP);if(a.length===2){(st[a[0]]=st[a[0]]||{})[a[1]]={};docs[a[0]+SEP+a[1]]=1}});
  Object.keys(E).forEach(function(p){var e=E[p];if(e.d)return;var a=p.split(SEP);if(a.length<3||!docs[a[0]+SEP+a[1]])return;var d=st[a[0]][a[1]];
    if(a.length===3){if(isObj(e.v)&&e.v.__o){if(!isObj(d[a[2]]))d[a[2]]={}}else d[a[2]]=cp(e.v)}
    else{var f=a[2];if(!E[a[0]+SEP+a[1]+SEP+f]||E[a[0]+SEP+a[1]+SEP+f].d||!(isObj(E[a[0]+SEP+a[1]+SEP+f].v)&&E[a[0]+SEP+a[1]+SEP+f].v.__o))return;if(!isObj(d[f]))d[f]={};d[f][a.slice(3).join(SEP)]=cp(e.v)}});
  return st}
function entriesFrom(st,t){var f=flatAll(st),E={};Object.keys(f).forEach(function(p){E[p]={v:f[p],t:t}});return E}
/* iki kayıt kümesini birleştir: her yolda zamanı yeni olan kazanır */
function merge(A,B){var R={},ch=false;Object.keys(A).forEach(function(p){R[p]=A[p]});Object.keys(B).forEach(function(p){var a=R[p],b=B[p];if(!a||b.t>a.t){R[p]=b;if(!a||!eq(a,b))ch=true}});return {R:R,changed:ch}}
window.__madreSync={flatAll:flatAll,build:build,merge:merge,entriesFrom:entriesFrom};

/* ---------- Madre Enerji Rapor · uygulama sürümü (Firebase) ----------
   Veriler: Firestore "E" koleksiyonu. Her belge (ör. months/2026-11) bir Firestore belgesi; içinde alan alan zaman damgalı kayıtlar.
   Aynı alanı iki kişi değiştirirse en son yapılan geçerli olur. İnternet yokken değişiklikler telefonda/bilgisayarda bekler, bağlantı gelince gönderilir. */
var CFG=window.FIREBASE_CONFIG||{},PID=CFG.projectId||'yok',KEY='madre-app-'+PID,SEP='\u0001',DEV=null;
try{DEV=localStorage.getItem('madre-app-device')||('d-'+Math.random().toString(36).slice(2,8));localStorage.setItem('madre-app-device',DEV)}catch(e){DEV='d'}
var E={},lastST=0,dirty={},online=navigator.onLine,lastSync=null,errMsg='',USER=null,firstLoad=false;
try{var raw=localStorage.getItem(KEY);if(raw){var o0=JSON.parse(raw);if(o0&&o0.E){E=o0.E;lastST=o0.lastST||0;dirty=o0.dirty||{}}}}catch(e){}
var st=build(E);
var subs=[];function emit(){subs.forEach(function(s){try{s()}catch(e){}})}
var pT=null;function persist(){clearTimeout(pT);pT=setTimeout(persistNow,300)}
function persistNow(){try{localStorage.setItem(KEY,JSON.stringify({saved:new Date().toISOString(),lastST:lastST,dirty:dirty,E:E}))}catch(e){}}
function gkey(p){var a=p.split(SEP);return a[0]+SEP+a[1]}
function markDirty(paths){paths.forEach(function(p){dirty[gkey(p)]=1})}
var clock=0;function now(){var t=Date.now();if(t<=clock)t=clock+1;clock=t;return t}
/* yerel değişiklik: eski ve yeni belgeyi karşılaştırıp değişen yollara yeni zaman damgası ver */
function commit(c,id,newDoc){var t=now(),oldF={},newF={};if(st[c]&&st[c][id])flatDoc(c,id,st[c][id],oldF);if(newDoc)flatDoc(c,id,newDoc,newF);
  var keys={};Object.keys(oldF).forEach(function(k){keys[k]=1});Object.keys(newF).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(p){if(p in newF){if(!(p in oldF)||!eq(oldF[p],newF[p]))E[p]={v:newF[p],t:t,by:DEV}}else E[p]={d:1,t:t,by:DEV}});
  dirty[c+SEP+id]=1;st=build(E);persist();emit();scheduleSync()}
function mergeDeep(a,b){Object.keys(b).forEach(function(k){var v=b[k];if(isObj(v)&&v.__delete__)delete a[k];else if(isObj(v)&&isObj(a[k]))mergeDeep(a[k],v);else a[k]=v});return a}
function col(name){return {onSnapshot:function(cb){var f=function(){var s=st[name]||{};cb({docs:Object.keys(s).map(function(id){var v=s[id];return {id:id,exists:true,data:function(){return cp(v)}}})})};subs.push(f);setTimeout(f,0);return function(){}},doc:function(id){return docRef(name+'/'+id)}}}
function docRef(p){var a=p.split('/'),c=a[0],id=a[1];return {
  onSnapshot:function(cb){var f=function(){var v=(st[c]||{})[id];cb({exists:!!v,data:function(){return v?cp(v):undefined}})};subs.push(f);setTimeout(f,0);return function(){}},
  get:async function(){var v=(st[c]||{})[id];return {exists:!!v,data:function(){return v?cp(v):undefined}}},
  set:async function(v){commit(c,id,cp(v))},
  update:async function(v){var cur=cp((st[c]||{})[id]||{});commit(c,id,mergeDeep(cur,cp(v)))},
  delete:async function(){commit(c,id,null)}}}
var db={collection:col,doc:docRef};
function dl(name,blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500)}
window.claude={use:async function(n){if(n==='db')return db;if(n==='user')return {can:function(){return true},me:async function(){return {name:USER&&USER.email||''}}};if(n==='downloads')return {save:async function(o){dl(o.filename,o.data instanceof Blob?o.data:new Blob([o.data]));return {status:'saved'}}};return null}};

/* ---------- güncelleme paketleri: Claude’un hazırladığı veri düzeltmeleri, her veri setine bir kez uygulanır ---------- */
var patchBusy=false;
function applyPatches(list){if(patchBusy)return;var P=list||[];if(!P.length)return;patchBusy=true;var done=0,names=[];
  try{P.forEach(function(pk){var meta=((st.meta||{}).patches)||{};if(meta[pk.id])return;var all=true,any=false,m=cp(meta);
    pk.ops.forEach(function(o,i){var key=pk.id+'#'+i;if(m[key])return;var cur=(st[o.c]||{})[o.id],ok=true;
      if(o.op==='update'){if(!(o.ifOlder&&cur&&cur[o.ifOlder.field]&&cur[o.ifOlder.field]>=o.ifOlder.value))commitQuiet(o.c,o.id,mergeDeep(cp(cur||{}),cp(o.data)))}
      else if(o.op==='updateWhere'){var col_=st[o.c]||{},n=0;Object.keys(col_).forEach(function(id){var r=col_[id];if(!r)return;if(Object.keys(o.where).every(function(k){return r[k]===o.where[k]})){commitQuiet(o.c,id,mergeDeep(cp(r),cp(o.data)));n++}});ok=n>0}
      else if(o.op==='deleteWhere'){var all2=st[o.c]||{};Object.keys(all2).forEach(function(id){var r=all2[id];if(r&&Object.keys(o.where).every(function(k){return r[k]===o.where[k]}))commitQuiet(o.c,id,null)})}
      else if(o.op==='delete'){if(cur&&(!o.ifAmtNull||cur.amt==null))commitQuiet(o.c,o.id,null)}
      else if(o.op==='setIfMissing'){if(!cur){var d=cp(o.data);if(o.copy){var src=(st[o.copy.c]||{})[o.copy.id];if(src)o.copy.fields.forEach(function(f){if(src[f]!=null&&src[f]!=='')d[f]=cp(src[f])})}commitQuiet(o.c,o.id,d)}}
      if(ok){m[key]=new Date().toISOString();any=true}else all=false});
    if(all)m[pk.id]=new Date().toISOString();if(any||all){commitQuiet('meta','patches',m);done++;names.push(pk.title||pk.id)}});
  }catch(e){status('Güncelleme paketi uygulanamadı: '+((e&&e.message)||e),'err')}
  patchBusy=false;if(done){st=build(E);persist();emit();scheduleSync();status('Veri güncellemesi uygulandı: '+names[names.length-1]+(names.length>1?' (+'+(names.length-1)+' önceki)':''))}}
function commitQuiet(c,id,newDoc){var t=now(),oldF={},newF={};if(st[c]&&st[c][id])flatDoc(c,id,st[c][id],oldF);if(newDoc)flatDoc(c,id,newDoc,newF);
  var keys={};Object.keys(oldF).forEach(function(k){keys[k]=1});Object.keys(newF).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(p){if(p in newF){if(!(p in oldF)||!eq(oldF[p],newF[p]))E[p]={v:newF[p],t:t,by:DEV}}else E[p]={d:1,t:t,by:DEV}});dirty[c+SEP+id]=1;st=build(E)}

/* ---------- Firestore eşitleme ---------- */
var FB=null,FS=null,AUTH=null,unsub=null,flushing=false,fT=null;
function docId(g){var a=g.split(SEP);return encodeURIComponent(a[0])+'~'+encodeURIComponent(a[1]).replace(/\./g,'%2E')}
function groupEntries(g){var o={},pre=g+SEP;Object.keys(E).forEach(function(p){if(p===g||p.indexOf(pre)===0)o[p]=E[p]});return o}
function tsMs(x){return x&&typeof x.toMillis==='function'?x.toMillis():0}
function absorb(j){var inc;try{inc=JSON.parse(j)}catch(e){return false}var m=merge(E,inc);if(m.changed){E=m.R;return true}return false}
function scheduleSync(){clearTimeout(fT);fT=setTimeout(flush,800)}
async function flush(){if(!FS||!USER||flushing)return;var keys=Object.keys(dirty);if(!keys.length){status();return}
  if(!navigator.onLine){status();return}
  flushing=true;var changedLocal=false,fail=0;
  for(var i=0;i<keys.length;i++){var g=keys[i];
    try{await FS.runTransaction(async function(tx){var ref=FS.collection('E').doc(docId(g));var s=await tx.get(ref);
        var remote={};if(s.exists){try{remote=JSON.parse(s.data().j)}catch(e){remote={}}}
        var mine=groupEntries(g);var toRemote=merge(remote,mine);var toLocal=merge(mine,remote);
        if(toLocal.changed){Object.keys(remote).forEach(function(p){if(!E[p]||remote[p].t>E[p].t)E[p]=remote[p]});changedLocal=true}
        if(toRemote.changed||!s.exists){var j=JSON.stringify(toRemote.R);if(j.length>950000)throw new Error('“'+g.replace(SEP,'/')+'” çok büyük ('+Math.round(j.length/1024)+' KB)');
          var mx=0;Object.keys(toRemote.R).forEach(function(p){if(toRemote.R[p].t>mx)mx=toRemote.R[p].t});
          tx.set(ref,{c:g.split(SEP)[0],id:g.split(SEP)[1],j:j,t:mx,by:USER.email||DEV,st:firebase.firestore.FieldValue.serverTimestamp()})}});
      delete dirty[g]}
    catch(e){fail++;errMsg=fbErr(e)}}
  flushing=false;if(changedLocal){st=build(E);emit()}persistNow();
  if(!fail){errMsg='';lastSync=new Date()}status();
  if(fail)setTimeout(scheduleSync,10000);else if(Object.keys(dirty).length)scheduleSync()}
function listen(){if(unsub)unsub();
  var q=FS.collection('E');if(lastST>0&&Object.keys(E).length)q=q.where('st','>=',firebase.firestore.Timestamp.fromMillis(lastST));
  unsub=q.onSnapshot(function(snap){var ch=false;
      snap.docChanges().forEach(function(c){if(c.type==='removed')return;var d=c.doc.data();if(d&&d.j&&absorb(d.j))ch=true;var t=tsMs(d.st);if(t>lastST)lastST=t});
      if(!snap.metadata.hasPendingWrites){lastSync=new Date();errMsg=''}
      firstLoad=true;if(ch){st=build(E);emit()}persist();status();showEmpty()},
    function(e){errMsg=fbErr(e);status();if(/permission/i.test(e.code||'')){showLogin('Bu e-posta adresinin verilere erişim izni yok. Yöneticiden adresinizin izin listesine eklenmesini isteyin.')}else setTimeout(listen,15000)})}
function fbErr(e){var c=(e&&e.code)||'',m=(e&&e.message)||String(e);
  var T={'permission-denied':'erişim izni yok (e-posta izin listesinde değil)','unavailable':'sunucuya ulaşılamıyor (internet bağlantısını kontrol edin)','auth/invalid-credential':'e-posta ya da şifre hatalı','auth/wrong-password':'şifre hatalı','auth/user-not-found':'bu e-posta ile kullanıcı yok','auth/invalid-email':'e-posta adresi geçersiz','auth/too-many-requests':'çok fazla deneme yapıldı, biraz sonra yeniden deneyin','auth/network-request-failed':'internet bağlantısı yok','auth/user-disabled':'bu kullanıcı devre dışı bırakılmış','failed-precondition':'veritabanı hazır değil','auth/missing-password':'şifre girin','auth/invalid-login-credentials':'e-posta ya da şifre hatalı'};
  return T[c]||T[c.replace(/^firestore\//,'')]||m}
window.addEventListener('online',function(){online=true;status();scheduleSync()});window.addEventListener('offline',function(){online=false;status()});
setInterval(function(){if(Object.keys(dirty).length)scheduleSync()},30000);

/* ---------- veri aktarma: masaüstü ortak dosyası, yedek ya da Claude’un hazırladığı güncelleme paketi ---------- */
function importText(t){var o=JSON.parse(t);
  if(o&&Array.isArray(o.patches)){applyPatches(o.patches);scheduleSync();return 'Güncelleme paketi uygulandı: '+o.patches.map(function(p){return p.title||p.id}).join(', ')}
  var inc=null;if(o&&o.E&&typeof o.E==='object')inc=o.E;else if(o&&o.data&&o.data.months)inc=entriesFrom(o.data,1);
  if(!inc)throw new Error('Bu dosya Madre Enerji Rapor verisi değil');
  var n=0;Object.keys(inc).forEach(function(p){var a=E[p],b=inc[p];if(!a||b.t>a.t){E[p]=b;dirty[gkey(p)]=1;n++}});
  // dosyadakinden daha yeni yerel kayıtlar da sunucuya gitsin
  Object.keys(inc).forEach(function(p){dirty[gkey(p)]=1});
  st=build(E);persistNow();emit();scheduleSync();return n+' kayıt aktarıldı; sunucuya gönderiliyor'}
function pickImport(){var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=function(){var f=i.files[0];if(!f)return;f.text().then(function(t){var r=importText(t);toast(r)}).catch(function(e){alert('Aktarılamadı: '+(e.message||e))})};i.click()}
function exportBackup(){dl('Madre_Enerji_Rapor_yedek_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({app:'madre-odeme-takip',format:2,saved:new Date().toISOString(),by:USER&&USER.email,E:E})],{type:'application/json'}))}

/* ---------- giriş ekranı ve üst şerit ---------- */
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function toast(m){var t=document.getElementById('appbar_toast');if(!t)return;t.textContent=m;t.style.display='';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},6000)}
function showLogin(msg){var L=document.getElementById('login');if(!L)return;L.style.display='flex';var e=document.getElementById('lg_err');e.textContent=msg||'';e.style.display=msg?'':'none';document.documentElement.classList.add('locked')}
function hideLogin(){var L=document.getElementById('login');if(L)L.style.display='none';document.documentElement.classList.remove('locked')}
function showEmpty(){var b=document.getElementById('appbar_empty');if(!b)return;b.style.display=(firstLoad&&!Object.keys(st.months||{}).length)?'':'none'}
function status(){var t=document.getElementById('appbar_t');if(!t)return;var n=Object.keys(dirty).length,s='';
  if(!USER)s='Giriş yapılmadı';
  else if(!navigator.onLine)s='İnternet yok · '+(n?n+' değişiklik bağlantı gelince gönderilecek':'kayıtlı veriler gösteriliyor');
  else if(errMsg)s='Eşitleme sorunu: '+errMsg+(n?' · '+n+' değişiklik bekliyor':'');
  else if(n)s='Gönderiliyor… ('+n+')';
  else s='Eşitlendi'+(lastSync?' · '+lastSync.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'');
  t.textContent=s;var dot=document.getElementById('appbar_dot');if(dot)dot.style.background=!USER?'#B9C0C7':(!navigator.onLine||n)?'#D9B25F':errMsg?'#CF8A7E':'#7DB894';
  var u=document.getElementById('appbar_u');if(u)u.textContent=USER?USER.email:''}
document.addEventListener('DOMContentLoaded',function(){
  var bs='font:inherit;padding:5px 11px;border:1px solid var(--line,#E4E8EC);border-radius:8px;background:var(--panel,#fff);color:var(--ink,#28323C);cursor:pointer';
  var bar=el('<div id="appbar" style="position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 16px;background:var(--panel2,#F8F9FA);border-bottom:1px solid var(--line,#E4E8EC);font:13px/1.4 system-ui,sans-serif;color:var(--muted,#7A8692)">'+
    '<span id="appbar_dot" style="width:8px;height:8px;border-radius:50%;background:#B9C0C7;flex:none"></span><span id="appbar_t" style="flex:1;min-width:150px"></span>'+
    '<span id="appbar_toast" style="display:none;color:var(--ink,#28323C);background:var(--accent-soft,#EBF3F4);padding:3px 9px;border-radius:6px"></span>'+
    '<span id="appbar_u"></span>'+
    '<details id="appbar_m" style="position:relative"><summary style="'+bs+';list-style:none">Menü</summary><div style="position:absolute;right:0;top:34px;background:var(--panel,#fff);border:1px solid var(--line,#E4E8EC);border-radius:10px;box-shadow:0 8px 28px rgba(40,50,60,.14);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:230px;z-index:70">'+
      '<button id="ab_imp" style="'+bs+';text-align:left">Veri aktar (masaüstü dosyası / yedek / güncelleme)</button>'+
      '<button id="ab_bk" style="'+bs+';text-align:left">Yedeği indir</button>'+

          daily[k].forEach((vals,j)=>{const s=vals.reduce((a,x)=>a+x[1],0),err=Math.abs(s-ln.amt)/(Math.abs(ln.amt)||1);
            if(vals[0]&&vals[0].length>2&&(!bm||err<bm[0]))bm=[err,vals];if(used.has(k+j))return;if(!best||err<best[0])best=[err,k+j,vals]})});

        {const hm=hb.filter(b=>b!==hp&&(b.title.startsWith(w0)||b.title.startsWith(nm.split(' (')[0]))&&ln.mwh>0&&Math.abs(b.tot-ln.mwh)<=Math.max(1,ln.mwh*0.005));
          if(hm.length){const o={};Object.entries(hm[0].h).forEach(([dd,hv])=>o[dd]=hv.map(v=>v||0));ln.hourMwh=o}}
        if(best&&best[0]<0.02){dv=best[2];used.add(best[1])}else if(Math.abs(ln.amt)>0.5)warn.push(`${ln.firm}: günlük döküm bulunamadı, tutar raporun kapsadığı günlere dağıtıldı`)}

    {lines.forEach(ln=>{if(ln.daily||ln.dayMwh||!(ln.mwh>0)||/FİNANS/.test(up(ln.group)))return;const nm=up(ln.firm),w0=nm.split(' ')[0];let best=null;
      const fn=fold(nm),fw=fold(w0);Object.keys(daily).forEach(k=>{const [sd,kn0]=k.split('|'),kn=fold(kn0);if(sd!==ln.side||!(kn===fn||kn.startsWith(fw)||fn.startsWith(kn.split(' ')[0])))return;
        daily[k].forEach((vals,j)=>{if(usedV.has(k+'#'+j))return;const t=vals.reduce((a,x)=>a+(+x[2]||0),0);if(Math.abs(t-ln.mwh)<=Math.max(0.5,ln.mwh*0.002)&&!best)best=[k+'#'+j,vals]})});
      if(best){usedV.add(best[0]);const o={};best[1].forEach(x=>{o[x[0].slice(8)]=+x[2]||0});ln.listMwh=o}
      // saatlik profil tablosu (ör. RENERJİA hafta içi 08–16) varsa saat saat miktar
      {const hm=hb.filter(b=>b!==hp&&fold(b.title).startsWith(fw)&&Math.abs(b.tot-ln.mwh)<=Math.max(1,ln.mwh*0.005));if(hm.length){const o={};Object.entries(hm[0].h).forEach(([dd,hv])=>o[dd]=hv.map(v=>v||0));ln.hourMwh=o}}})}

    if(!covered.length)covered=[...new Set(Object.values(daily).flat().flatMap(vals=>vals.filter(x=>Math.abs(x[1])>0.005).map(x=>x[0])))].sort();
    lines.forEach(ln=>{const dv=ln._dv;delete ln._dv;
      ln.dues=dues(ln,y,m,dv,hol,kdvDay,covered);if(ln.mwh)ln.unit=ln.amt/ln.mwh;

      if(ln.dues.some(d=>/notta tarih yok/.test(d.label)))warn.push(`${ln.firm} · ${ln.group}: raporda ödeme tarihi yazmıyor, izleyen ayın 20’si varsayıldı`);
      if(ln.amt!=null&&Math.abs(ln.amt)>0.5&&Math.abs((ln.kdv||0)/ln.amt-0.2)>0.002)warn.push(`${ln.firm} · ${ln.group}: KDV ${nfx(ln.kdv||0)} (tutarın %${nfx((ln.kdv||0)/ln.amt*100)}’i) — %20 olmalı, raporu kontrol edin`);
      let p=ln.paidRep||0;delete ln.paidRep;delete ln.daily;
      if(p>0.005){const ds=ln.dues.slice().sort((a,b)=>(a.date+a.k).localeCompare(b.date+b.k));for(let j=0;j<ds.length&&p>0.005;j++){const take=j<ds.length-1?Math.min(p,ds[j].amt):p;if(take>0.005)paid[ln.id+'_'+ds[j].k]={amt:Math.round(take*100)/100,src:'rapor'};p-=take}}
    });
    // listede alıcı ve satıcı ikisi de MADRE yazılmış blok (karşı taraf yanlış girilmiş): toplamı tutan, listede karşılığı bulunamayan satıra bağlanır ve uyarılır
    lines.forEach(ln=>{if(ln.daily||ln.dayMwh||ln.listMwh||!(ln.mwh>0)||/FİNANS/.test(up(ln.group)))return;
      Object.keys(daily).forEach(k=>{if(ln.listMwh)return;const [sd,kn]=k.split('|');if(!/^madre/.test(fold(kn)))return;daily[k].forEach((vals,j)=>{if(ln.listMwh||usedV.has(k+'#'+j))return;const t=vals.reduce((a,x)=>a+(+x[2]||0),0);
        if(Math.abs(t-ln.mwh)<=Math.max(0.5,ln.mwh*0.002)){usedV.add(k+'#'+j);const o={};vals.forEach(x=>{o[x[0].slice(8)]=+x[2]||0});ln.listMwh=o;const ds=vals.filter(x=>+x[2]>0).map(x=>x[0]);
          warn.push(`${ln.firm} · ${ln.group} (${ln.side==='alis'?'alış':'satış'}, ${nfx(t)} MWh${ds.length?`, ${ds[0].slice(8)}–${ds[ds.length-1].slice(8)}`:''}): ikili anlaşma listesinde alıcı ve satıcı ikisi de MADRE yazılmış; ${ln.side==='alis'?'satıcı':'alıcı'} ${ln.firm} olmalı. Miktarlar yine de bu satıra bağlandı.`)}})})});
    /* ikili anlaşma listesinde olup raporun genel toplamında satırı olmayan teslimler (ör. tutarı henüz yazılmamış yeni alış) — EPİAŞ dengesine girer */
    const listExtra=[];Object.keys(daily).forEach(k=>{const [sd,kn]=k.split('|');if(/^ENERJİ PİYASALARI|^EPİAŞ/.test(kn))return;daily[k].forEach((vals,j)=>{if(usedV.has(k+'#'+j))return;const t=vals.reduce((a,x)=>a+(+x[2]||0),0);if(!(t>0))return;
      const o={};vals.forEach(x=>{o[x[0].slice(8)]=+x[2]||0});listExtra.push({side:sd,firm:kn.split(' ')[0],fullName:kn,mwh:t,listMwh:o})})});
    listExtra.forEach(x=>warn.push(`${x.firm} (${x.side==='alis'?'alış':'satış'}): ikili anlaşma listesinde ${nfx(x.mwh)} MWh var ama genel toplamda satırı yok; kesinleşmemiş sayıldı, ödemelere ve EPİAŞ dengesine eklenmedi`));
    return {lines,paid,warn,hourPtf,listExtra};
  }
  // EFET Ek-2a protokolü
  function protocol(book,fileName){

    const pm=priceTxt.match(/([\d.,]+)\s*(TL|USD|\$|EUR)\s*\/?\s*MWH/i)||priceTxt.match(/([\d.,]+)\s*(TL|USD)/i);
    const price=pm?pn(pm[1]):null,cur=pm&&/USD|\$/i.test(pm[2])?'USD':'TL';

    const tem=String(g('TEMİNAT')||'');let coll=null,temNote='';const noTem=t=>/sağlamayacak|sağlanmayacak|talep etmeyecek|talep edilmeyecek|vermeyecek|verilmeyecek|istemeyecek|istenmeyecek|alınmayacak|teminat\s+yok/i.test(t);

    if(temRef){const ds=[...tem.matchAll(/(\d{1,2}\.\d{1,2}\.\d{4})\s*tarihli\s*([^,.;\n]+?)(?=\s+ve\s|\s+hükümlerine|\s+bu\s|[,.;\n]|$)/gi)].map(x=>x[1]+' tarihli '+x[2].trim());
      temNote='Teminat: '+(ds.length?ds.join(' ve ')+' hükümlerine tabi':tem.replace(/\s+/g,' ').trim().slice(0,200))+' (bu protokolde tutar yok).'}
    else if(tem&&!noTem(tem)){const am=tem.match(/([\d.]+(?:,\d+)?)\s*(TL|USD)/i);const dd=[...tem.matchAll(/(\d{1,2})\.(\d{1,2})\.(\d{4})/g)].map(x=>`${x[3]}-${pad(+x[2])}-${pad(+x[1])}`);
      coll={text:tem.replace(/\s+/g,' ').trim(),amount:am?pn(am[1]):null,cur:am&&/USD/i.test(am[2])?'USD':'TL',due:dd[0]||null,until:dd[1]||null}}
    const payTxt=String(g('FATURALANDIRMA')||g('ÖDEME ŞEKLİ')||g('ÖDEME')||'');const PT=up(payTxt)+' '+up(fileName);const t2=/T\s*\+\s*2|EPİAŞ.*(AVANS|VADE|ÖDEME GÜN)|GÜNLÜK/.test(PT)&&!/AYIN\s*\d{1,2}\.?\s*(TAKVİM|İŞ)?\s*GÜN/.test(up(payTxt));const pd=(payTxt.match(/ayın\s*(\d{1,2})\.?\s*(?:takvim|iş)?\s*gün/i)||[])[1];
    let firm=up(cp.split(/\s+/)[0]);if(firm==='IC')firm='İÇTAŞ';
    const warn=[],start=asDate(g('BAŞLANGIÇ')),end=asDate(g('BİTİŞ'));
    // ödeme: metinde açık tarih varsa (ör. “11.11.2026 tarihinde … KDV 21.12.2026”) o tarihler; yoksa “ayın 20’si / 20. gün” kalıpları
    const PU=up(payTxt),pdates=[...PU.matchAll(/(\d{1,2})[./](\d{1,2})[./](\d{4})/g)].map(x=>({i:x.index,d:`${x[3]}-${pad(+x[2])}-${pad(+x[1])}`}));
    const pd2=pd||(PU.match(/AYIN\s*(\d{1,2})\s*(?:['’]?\s*(?:Sİ|SI|İNCİ|INCI|ÜNCÜ|UNCU)|\.)/)||PU.match(/(\d{1,2})\s*\.\s*(?:TAKVİM\s*|İŞ\s*)?GÜN/)||[])[1];

    const avans=/AVANS/.test(PU)&&/MAHSUP/.test(PU)&&pdates.length>=2;let avNote='';
    if(t2){pay={t:'T2'};ptext='EPİAŞ T+2 günlük ödeme (KDV hariç), KDV izleyen ay'}
    else if(avans&&start&&end&&start.slice(0,7)===end.slice(0,7)){const av=pdates[0].d,last=pdates.map(x=>x.d).filter(d=>d>av).sort().slice(-1)[0]||av;
      pay={t:'D',date:last};ptext=keyTxt;avNote=`Avans: ${av.split('-').reverse().join('.')} tarihinde alıcı avans ödemiş (tutarı protokolde yok); enerji bedeli ${last.split('-').reverse().join('.')} faturasından mahsup edilir, KDV ${last.split('-').reverse().join('.')}.`;
      warn.push(`${av.split('-').reverse().join('.')} tarihli avansın tutarı protokolde yazmıyor; enerji bedeli ve KDV ${last.split('-').reverse().join('.')} vadesine kaydedildi. Avans tahsil edildiyse Ödemeler’de bu kalemde “Tutar gir” ile işleyin.`)}
    else if(pdates.length&&start&&end&&start.slice(0,7)===end.slice(0,7)){const ki=PU.search(/KDV/);const kd=ki>=0?pdates.find(x=>x.i>ki&&x.d!==pdates[0].d):null;const am=pdates.find(x=>!kd||x!==kd);
      pay=kd&&am&&am.d!==kd.d?{t:'D',date:am.d,kdvDate:kd.d}:{t:'D',date:(am||pdates[0]).d};ptext=keyTxt}
    else if(pd2){pay={t:'S',day:+pd2};ptext=`Teslim ayını izleyen ayın ${+pd2}’si, KDV dahil (tatilse sonraki iş günü)`}
    else if(pdates.length){const dd=+pdates[0].d.slice(8);pay={t:'S',day:dd};ptext=keyTxt;warn.push(`Ödeme metninde tarih var (${pdates.map(x=>x.d.split('-').reverse().join('.')).join(', ')}) ama sözleşme birden çok ayı kapsıyor; her ayın ${dd}’si varsayıldı, kontrol edin.`)}
    else{pay={t:'S',day:20};ptext=payTxt?payTxt.replace(/\s+/g,' ').trim().slice(0,200):'İzleyen ayın 20’si';warn.push('Protokolde ödeme günü bulunamadı; teslim ayını izleyen ayın 20’si varsayıldı. Doğru değilse “Düzenleyerek ekle” ile değiştirin.')}
    if(!start||!end)warn.push('Teslim başlangıç/bitiş tarihi okunamadı; “Düzenleyerek ekle” ile girin.');else if(end<start)warn.push('Bitiş tarihi başlangıçtan önce görünüyor; kontrol edin.');
    if(!(mw>0))warn.push('Kapasite (MW) okunamadı.');
    if(price==null&&!/PTF/i.test(priceTxt))warn.push('Fiyat okunamadı.');
    if(priceMain&&payFormula){const nums=t=>(String(t).match(/\d+(?:[.,]\d+)*/g)||[]).map(x=>pn(x)).filter(x=>x!=null&&x>0);const a=nums(priceMain),b=nums(payFormula);
      const bad=/PTF/i.test(priceMain)?a.some(x=>!b.includes(x))||!/PTF/i.test(payFormula):(a[0]!=null&&b.length&&!b.includes(a[0]));
      if(bad)warn.push(`Sözleşme fiyatı (“${String(priceMain).trim()}”) ile ödeme bedeli formülü (“${payFormula.replace(/\s+/g,' ').trim().slice(0,60)}”) farklı; sözleşme fiyatı esas alındı, karşı tarafla teyit edin.`)}

    if(!temRef&&tem&&!noTem(tem)&&coll&&coll.amount==null)warn.push('Teminat metni var ama tutarı okunamadı.');

      start,end,pay,payText:ptext,
      formula:/PTF/i.test(priceTxt)?E.toFormula(((priceTxt.match(/PTF[^.;]{0,60}/i)||[''])[0]).trim()):null,

function addedAt(c){if(c.added)return c.added;const m=/^c([0-9a-z]{8})/.exec(c.id||'');if(m){const t=parseInt(m[1],36);if(t>1.6e12&&t<2.2e12)return new Date(t).toISOString()}return null}

  const k=Parse.fold(l.firm),[y,m]=l.ym.split('-').map(Number),ms=l.ym+'-01',me=`${l.ym}-${pad(new Date(Date.UTC(y,m,0)).getUTCDate())}`,hrs=new Date(Date.UTC(y,m,0)).getUTCDate()*24;
  const cs=Object.values(S.contracts).filter(c=>c.side===l.side&&c.start&&c.start<=me&&c.end>=ms&&!newerThanReport(c,l.ym)&&(c.cur||'TL')===(l.cur||'TL')&&(()=>{const f=Parse.fold(c.firm);return f&&k&&(f.startsWith(k)||k.startsWith(f))})());
  // aynı başlıktakileri (Vadeli, Ön Ödemeli …) öne al; kapasitesi uyan birden fazla sözleşme varsa (ör. ayın 1–7’si ve 8–30’u için iki ayrı protokol) dönemlerini birleştir
  let pool=cs;if(cs.length>1){const g=cs.filter(x=>Parse.fold(x.group||'')===Parse.fold(l.group||''));if(g.length)pool=g}

  const ovl=c=>{const a=c.start>ms?c.start:ms,b=c.end<me?c.end:me;return b<a?0:E.diffDays(b,a)+1},expM=c=>(c.mwByMonth&&c.mwByMonth[l.ym]!=null?+c.mwByMonth[l.ym]:+c.mw||0)*24*ovl(c),okM=(c,v)=>Math.abs(expM(c)-v)<=Math.max(1,v*0.01);

  if(!sel.length&&pool.length>1){const sib=((S.months[l.ym]||{}).lines||[]).filter(x=>x.side===l.side&&Parse.fold(x.firm)===k&&Parse.fold(x.group||'')===Parse.fold(l.group||'')&&(!byQ||Math.abs((x.mwh||0)-l.mwh)<=Math.max(1,l.mwh*0.01)));

  {const dm=l.dayMwh||l.listMwh;if(dm){const ds=Object.keys(dm).filter(k=>+dm[k]>0).sort();if(ds.length)return {s:l.ym+'-'+ds[0],e:l.ym+'-'+ds[ds.length-1],src:'liste'}}}
  return {s:ms,e:me,src:'ay'}}

/* Ödemeler: banka bakiyesinden başlayıp her ödeme/tahsilattan sonraki bakiye */
function payStatus(d,side){

const effAmt=d=>d.paid>0?d.paid:(d.amt||0); // gerçekleşen girildiyse o, yoksa planlanan

function monthNet(M,all){ // ayın gerçekleşen ve tahmini net akışı (TL)
  const days=E.monthDays(M);all=all||duesInMonth(M);let a=0,e=0;
  all.forEach(({l,d})=>{const k=l.side==='satis'?1:-1;const pa=d.paid>0?toTL(d.paid,l.cur):0,pe=toTL(effAmt(d),l.cur);a+=k*(pa||0);e+=k*(pe||0)});
  kayitIn(days[0],days[days.length-1]).forEach(k=>{const v=(k.gelir||0)-(k.gider||0);a+=v;e+=v});return {a,e};

function monthStart(M,depth){ // {v, src:'girildi'|'devreden'|'yok'}

function parsePTF(text,M){
  const days=E.monthDays(M),acc={},cnt={},hh={};let seq=0;const mk=S.market[M]||{},have=mk.ptf||{};while(seq<days.length&&have[days[seq].slice(8)]!=null)seq++;
  text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line)return;let date=null;const rest=[];
    line.split(/\t|;|\s+/).filter(Boolean).forEach(t=>{let m;
      if(!date&&(m=t.match(/^(\d{4})-(\d{2})-(\d{2})/)))date=`${m[1]}-${m[2]}-${m[3]}`;
      else if(!date&&(m=t.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/)))date=`${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
      else if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(t))return;else rest.push(t)});
    const nums=rest.map(t=>/\d/.test(t)?pn(t):null).filter(v=>v!=null);if(!nums.length)return;
    const vals=nums.length>=20?nums.slice(0,24):[nums[0]];
    if(!date){if(seq>=days.length)return;date=days[seq++]}
    vals.forEach(v=>{acc[date]=(acc[date]||0)+v;cnt[date]=(cnt[date]||0)+1;(hh[date]=hh[date]||[]).push(v)})});
  return withHours(group(acc,cnt),hh);
}

function group(acc,cnt){const out={};Object.keys(acc).forEach(d=>{const ym=d.slice(0,7);(out[ym]=out[ym]||{})[d.slice(8)]=acc[d]/cnt[d]});return out}

  if(e.target.id==='acilis'){const v=pn(e.target.value);saveMarket(S.ym,{acilisTL:v==null?null:v}).then(ok=>ok&&toast('Ay başı bakiyesi kaydedildi'));return}
  if(e.target.id==='s_rate2'){const v=pn(e.target.value);saveSettings({usdRate:v&&v>0?v:null});return}
  if(e.target.id==='s_rate'){const v=pn(e.target.value);saveSettings({usdRate:v&&v>0?v:null})}
  if(e.target.id==='s_incl'){saveSettings({inclIn:e.target.checked})}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S._qf=1;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.editKey){S.editKey=null;render()}closeDrawer()}if(e.key==='Enter'&&e.target.matches('[data-pay],[data-gpay]'))e.target.blur()});
$('#prev').onclick=()=>{S.ym=E.addMonths(S.ym,-1);ls.set('mo',S.ym);render()};$('#next').onclick=()=>{S.ym=E.addMonths(S.ym,1);ls.set('mo',S.ym);render()};
$('#xls').onclick=()=>{if(S.loaded<7)return toast('Veriler yükleniyor…');exportXls()};
$('#xlsall').onclick=()=>{if(S.loaded<7)return toast('Veriler yükleniyor…');exportAll()};
/* ---------- veri ---------- */
/* ===== Masaüstü ortak dosyasından web sürümünü güncelleme (telefon için) =====
   Masaüstü sürümünün Drive’daki ortak dosyası (Madre_Odeme_Takip_ortak_veri.json) ya da yedeği okunur;
   bu sayfanın verisi dosyadaki son hâle getirilir (masaüstü esas). */
S.raw={};function rawSnap(c,s){const o={};s.docs.forEach(d=>o[d.id]=d.data());S.raw[c]=o}
const isDesk=()=>!!window.__madreSync;
function deskBuild(E){const SEP='\u0001',st={},isO=v=>v&&typeof v==='object'&&!Array.isArray(v),cp=v=>v==null?v:JSON.parse(JSON.stringify(v));
  Object.keys(E).forEach(p=>{const e=E[p];if(!e||e.d)return;const a=p.split(SEP);if(a.length===2)(st[a[0]]=st[a[0]]||{})[a[1]]={}});
  Object.keys(E).forEach(p=>{const e=E[p];if(!e||e.d)return;const a=p.split(SEP);if(a.length<3||!st[a[0]]||!st[a[0]][a[1]])return;const d=st[a[0]][a[1]];
    if(a.length===3){if(isO(e.v)&&e.v.__o){if(!isO(d[a[2]]))d[a[2]]={}}else d[a[2]]=cp(e.v)}
    else{const f=a[2],pe=E[a[0]+SEP+a[1]+SEP+f];if(!pe||pe.d||!(isO(pe.v)&&pe.v.__o))return;if(!isO(d[f]))d[f]={};d[f][a.slice(3).join(SEP)]=cp(e.v)}});
  return st}
const SYNC_COLS=['contracts','months','paid','market','teminat','plan','kayit','bank','settings','adj'];
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
function syncPlan(file){const st=deskBuild(file.E),ops=[];
  SYNC_COLS.forEach(c=>{const want=st[c]||{},have=S.raw[c]||{};
    Object.keys(want).forEach(id=>{if(c==='settings'&&id!=='main')return;const w={...want[id]};if(c==='contracts'||c==='plan'||c==='kayit')delete w.id;const h=have[id]?{...have[id]}:null;if(h&&(c==='contracts'||c==='plan'||c==='kayit'))delete h.id;if(!h||canon(h)!==canon(w))ops.push({t:h?'güncelle':'ekle',c,id,data:w})});
    Object.keys(have).forEach(id=>{if(!want[id]&&!(c==='settings'))ops.push({t:'sil',c,id})})});
  return ops}
function syncCard(){if(isDesk())return '';const m=S.syncMeta,u=S.upl.sync;
  let h=`<section class="card" id="synccard"><h2>Masaüstü verisiyle güncelle <span class="n">telefon ve web için</span></h2><div class="upl">
   <div class="muted" style="font-size:13px;line-height:1.5">Masaüstü sürümünün Google Drive’daki ortak dosyasını (<b>Madre_Odeme_Takip_ortak_veri.json</b>) ya da bir yedeğini seçin. Bu sayfa masaüstündeki son hâle getirilir; masaüstü esas alınır, bu sayfada yapılıp masaüstünde olmayan değişiklikler silinir.</div>
   ${m?`<div style="font-size:13px">Son güncelleme: <b>${esc(new Date(m.at).toLocaleString('tr-TR'))}</b> · dosyanın masaüstünde kaydedildiği an: ${esc(new Date(m.saved).toLocaleString('tr-TR'))}</div>`:''}
   <label class="drop" id="drop_s" for="f_sync">Ortak dosyayı seçin<br><span style="font-size:12px">Telefonda “Drive” klasörünü açıp dosyaya dokunun</span></label>
   <input type="file" id="f_sync" hidden>`;
  if(u&&u.err)h+=`<div class="banner bad"><span>${esc(u.err)}</span></div>`;
  else if(u&&u.ops){const by=t=>u.ops.filter(o=>o.t===t).length;
    h+=u.ops.length?`<div class="banner info"><span><b>${esc(u.name)}</b> · masaüstünde ${esc(new Date(u.saved).toLocaleString('tr-TR'))} tarihinde kaydedilmiş. ${by('güncelle')} kayıt güncellenecek, ${by('ekle')} eklenecek, ${by('sil')} silinecek.</span></div>
      <div><button class="btn primary" data-syncgo ${u.busy?'disabled':''}>${u.busy?`Güncelleniyor… ${u.done||0}/${u.ops.length}`:'Bu sayfayı güncelle'}</button> <button class="btn" data-syncx>Vazgeç</button></div>`
     :`<div class="banner info"><span>Bu sayfa zaten <b>${esc(u.name)}</b> ile aynı, güncellenecek bir şey yok.</span></div>`}
  return h+`</div></section>`}
async function syncRun(){const u=S.upl.sync;if(!u||!u.ops||u.busy)return;if(S.canWrite===false){toast('Bu sayfayı güncelleme yetkiniz yok');return}
  u.busy=true;u.done=0;render();let fail=0;
  for(const o of u.ops){try{const ref=S.db.doc(o.c+'/'+o.id);if(o.t==='sil')await ref.delete();else await ref.set(o.data)}catch(e){fail++}u.done++;if(u.done%10===0)render()}
  try{await S.db.doc('meta/sync').set({at:new Date().toISOString(),saved:u.saved,by:u.by||'',file:u.name,ops:u.ops.length,fail})}catch(e){}
  S.upl.sync=null;render();toast(fail?`${fail} kayıt yazılamadı, tekrar deneyin`:`Güncellendi · ${u.ops.length} kayıt`)}

(async function init(){
  renderHeader();
  let db=null,user=null,dl=null;
  try{[db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')])}catch(e){}
  S.dl=dl;
  if(user){try{const cw=user.can('data.write');S.canWrite=cw!==false}catch(e){}}
  S.db=db;if(!db){S.loaded=-1;render();return}
  const err=()=>{S.loaded=7;sched()};const got=new Set();const ok=k=>{if(!got.has(k)){got.add(k);S.loaded=got.size}sched()};
  db.collection('contracts').onSnapshot(s=>{rawSnap('contracts',s);const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S.contracts=o;ok('c')},err);
  db.collection('months').onSnapshot(s=>{rawSnap('months',s);const o={};s.docs.forEach(d=>o[d.id]=d.data());S.months=o;ok('m')},err);
  db.collection('paid').onSnapshot(s=>{rawSnap('paid',s);const o={};s.docs.forEach(d=>o[d.id]=d.data());S.paid=o;ok('p')},err);
  db.collection('market').onSnapshot(s=>{rawSnap('market',s);const o={};s.docs.forEach(d=>o[d.id]=d.data());S.market=o;ok('mk')},err);
  db.collection('adj').onSnapshot(s=>{rawSnap('adj',s);const o={};s.docs.forEach(d=>o[d.id]=d.data());S.adj=o;sched()},()=>{});
  db.collection('teminat').onSnapshot(s=>{rawSnap('teminat',s);const o={};s.docs.forEach(d=>o[d.id]=d.data());S.teminat=o;sched()},()=>{});
  db.collection('plan').onSnapshot(s=>{rawSnap('plan',s);const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S.plan=o;sched()},()=>{});
  db.collection('kayit').onSnapshot(s=>{rawSnap('kayit',s);const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S.kayit=o;ok('k')},err);
  db.collection('bank').onSnapshot(s=>{rawSnap('bank',s);const o={};s.docs.forEach(d=>{const x=d.data();if(x.date)o[x.date]=x});S.bank=o;ok('b')},err);
  db.doc('meta/sync').onSnapshot(d=>{S.syncMeta=d.exists?d.data():null;sched()},()=>{});
  db.doc('settings/main').onSnapshot(d=>{S.raw.settings=d.exists?{main:d.data()}:{};if(d.exists)S.settings=Object.assign({kdv:0.2,holidays:[],epiasKdvDay:20,usdRate:null,inclIn:true},d.data());ok('s')},()=>ok('s'));
})();
})();
</script>
